services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secondbrain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    ports:
      - "${GARAGE_PORT:-9000}:9000"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      NODE_IP: ${GARAGE_NODE_IP:-127.0.0.1}
      GATEWAY: ${GARAGE_GATEWAY:-127.0.0.1:9000}
      ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-changeme-garage-admin-token}
    volumes:
      - garagedata:/data
    healthcheck:
      test: ["CMD", "garage", "cluster", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  garage-init:
    image: dxflrs/garage:v2.5.0
    depends_on:
      garage:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      garage --admin-token '${GARAGE_ADMIN_TOKEN:-changeme-garage-admin-token}' bucket create ${GARAGE_BUCKET:-secondbrain};
      exit 0"
    restart: on-failure

volumes:
  pgdata:
  redisdata:
  garagedata:
