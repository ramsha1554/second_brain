[project]
name = "secondbrain-api"
version = "0.1.0"
description = "Second Brain FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4,<25",
    "uvicorn>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "httpx>=0.28,<0.29",
    "import-linter>=1.6,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["secondbrain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=1.12.1",
    "mypy>=1.13.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.17.5",
]
